name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev dependencies
        run: pip install -r app/requirements-dev.txt

      - name: Run flake8
        run: flake8 app/ --max-line-length=120 --exclude=__pycache__

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev dependencies
        run: pip install -r app/requirements-dev.txt

      - name: Run pytest
        working-directory: app
        run: pytest test_app.py -v

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build app image
        run: docker build -t observability-lab-app:${{ github.sha }} ./app

      - name: Save image as artifact
        run: docker save observability-lab-app:${{ github.sha }} > app-image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: app-image.tar
          retention-days: 1

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load image
        run: docker load < app-image.tar

      - name: Tag image as latest
        run: docker tag observability-lab-app:${{ github.sha }} observability-lab-app:latest

      - name: Bring up full stack
        run: docker compose up -d

      - name: Wait for app to be healthy
        run: |
          for i in {1..30}; do
            if curl -fs http://localhost:5000/health > /dev/null; then
              echo "App is healthy"
              exit 0
            fi
            echo "Waiting for app... ($i/30)"
            sleep 2
          done
          echo "App did not become healthy"
          docker compose logs
          exit 1

      - name: Verify all endpoints
        run: |
          curl -fs http://localhost:5000/ | grep "App is running"
          curl -fs http://localhost:5000/health | grep "healthy"
          curl -fs http://localhost:5000/metrics | grep "app_requests_total"

      - name: Verify Prometheus is scraping
        run: |
          sleep 20
          curl -fs "http://localhost:9090/api/v1/query?query=app_requests_total" | grep "flask-app"

      - name: Verify Loki is ready
        run: curl -fs http://localhost:3100/ready

      - name: Tear down
        if: always()
        run: docker compose down -v

